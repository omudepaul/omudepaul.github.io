<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Paul Omude</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #172554, #1e293b);
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 700px;
        }

        .error-code {
            font-size: 110px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 20px;
            color: #93c5fd;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        a {
            display: inline-block;
            padding: 13px 28px;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .name {
            margin-top: 50px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 80px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you are looking for may have been moved,
            removed, or the address may be incorrect.
        </p>

        <a href="https://omudepaul.github.io/">
            Return to Homepage
        </a>

        <div class="name">
            © 2026 Paul Omude
        </div>

    </div>

</body>
</html>
